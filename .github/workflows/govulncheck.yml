name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: new vulnerabilities surface without code changes.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          go-package: ./...
