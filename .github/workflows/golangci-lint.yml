name: golangci-lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # golangci-lint v2.5.0 is built with go1.25; a newer Go toolchain
      # makes go/types panic ("file requires newer Go version"). Bump
      # these two pins together.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
